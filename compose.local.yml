# Local-machine overrides, loaded only when COMPOSE_FILE=compose.yml:compose.local.yml is set in .env
# (scripts/local-setup.sh does this). The server's .env never sets it, so server behavior is unchanged.
services:
  astro-dev:
    ports: !override
      - 127.0.0.1:${DEV_ASTRO_PORT}:3033

  abcwpdev:
    ports: !override
      - 127.0.0.1:${DEV_WP_PORT}:80

  # Not run locally; resetting env_file means their env files need not exist.
  abcwpstaging:
    env_file: !reset []

  deploy-orchestrator:
    env_file: !reset []
