services:
  proxy:
    image: caddy:2.11.2-alpine
    container_name: proxy
    restart: always
    mem_limit: 128m
    ports:
      - 80:80
      - 443:443
    environment:
      DOMAIN_DOCS: ${DOMAIN_DOCS}
      DOMAIN_PRODUCTION: ${DOMAIN_PRODUCTION}
      DOMAIN_WP_STAGING: ${DOMAIN_WP_STAGING}
      DOMAIN_WP_DEV: ${DOMAIN_WP_DEV}
      DOMAIN_DEV: ${DOMAIN_DEV}
      DOMAIN_STAGING: ${DOMAIN_STAGING}
      DOMAIN_PREVIEW: ${DOMAIN_PREVIEW}
    volumes:
      - ${PROXY_CADDYFILE}:/etc/caddy/Caddyfile
      - ${PROXY_LOG_DIR}:/var/log/caddy
      - proxy_data:/data
      - proxy_config:/config
    networks:
      - abcnorio_net_web
      - abcnorio_net_proxy
  astro-dev:
    build: 
      context: ${ASTRO_HOST_ROOT}
      dockerfile: Dockerfile
      args:
        SHARED_GID: ${PROJECT_GID}
        SHARED_GROUP: ${PROJECT_GROUP}
    container_name: astro-dev
    user: root
    restart: always
    command: ["bash", "-c", "umask 0002 && cd /app && ([ -x node_modules/.bin/astro ] || npm install) && npm run dev:docker"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3033/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 512m
    environment:
      DEV_CMS: ${DOMAIN_DEV_CMS}
      DEV_CMS_FETCH: http://abcwpdev/
      STAGING_CMS: ${DOMAIN_STAGING_CMS}
      MODE: ${DEV_MODE:-development}
      ASTRO_RUNTIME_CONTAINER: '1'
      MENU_ENDPOINT: ${MENU_ENDPOINT}
      REST_ENDPOINT: ${REST_ENDPOINT}
      BLOCKS_ENDPOINT: ${BLOCKS_ENDPOINT}
      DEV_SEARCH_API: ${DEV_SEARCH_API}
      STAGING_SEARCH_API: ${STAGING_SEARCH_API}
      DEV_FRONTEND_URL: https://${DOMAIN_DEV}/
      STAGING_FRONTEND_URL: https://${DOMAIN_STAGING}/
      PRODUCTION_FRONTEND_URL: https://${DOMAIN_PRODUCTION}/
      PREVIEW_FRONTEND_URL: https://${DOMAIN_PREVIEW}/
    ports: 
      - 127.0.0.1:3033:3033
    volumes:
      - ${ASTRO_SITE_DIR}:/app/
      - ${ASTRO_WEBCOMPONENTS_DIR}:/abcnorio-webcomponents
    networks:
      - abcnorio_net_proxy
  astro-staging:
    build:
      context: ${ASTRO_HOST_ROOT}
      dockerfile: Dockerfile
      args:
        SHARED_GID: ${PROJECT_GID}
        SHARED_GROUP: ${PROJECT_GROUP}
    container_name: astro-staging
    user: root
    restart: always
    mem_limit: 750m
    command: ["bash", "-c", "umask 0002 && cd /app && ([ -x node_modules/.bin/astro ] || npm install) && npm run dev:docker"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3033/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      DEV_CMS: ${DOMAIN_DEV_CMS}
      STAGING_CMS: ${DOMAIN_STAGING_CMS}
      STAGING_CMS_FETCH: http://abcwpstaging/
      MODE: ${STAGING_MODE:-staging}
      ASTRO_RUNTIME_CONTAINER: '1'
      MENU_ENDPOINT: ${MENU_ENDPOINT}
      REST_ENDPOINT: ${REST_ENDPOINT}
      BLOCKS_ENDPOINT: ${BLOCKS_ENDPOINT}
      DEV_SEARCH_API: ${DEV_SEARCH_API}
      STAGING_SEARCH_API: ${STAGING_SEARCH_API}
      DEV_FRONTEND_URL: https://${DOMAIN_DEV}/
      STAGING_FRONTEND_URL: https://${DOMAIN_STAGING}/
      PRODUCTION_FRONTEND_URL: https://${DOMAIN_PRODUCTION}/
      PREVIEW_FRONTEND_URL: https://${DOMAIN_PREVIEW}/
    ports:
      - 127.0.0.1:3034:3033
    volumes:
      - ${ASTRO_STAGING_SITE_DIR}:/app/
      - ${ASTRO_WEBCOMPONENTS_DIR}:/abcnorio-webcomponents
    depends_on:
      - deploy-orchestrator
    networks:
      - abcnorio_net_proxy
  astro-prod:
    build:
      context: ${ASTRO_HOST_ROOT}
      dockerfile: prod-ssr/Dockerfile
      args:
        SHARED_GID: ${PROJECT_GID}
        SHARED_GROUP: ${PROJECT_GROUP}
    container_name: astro-prod
    user: node
    restart: always
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:3033/search/api?q=health' >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      MODE: production
      PRODUCTION_FRONTEND_URL: https://${DOMAIN_PRODUCTION}/
      REST_ENDPOINT: ${REST_ENDPOINT}
      MENU_ENDPOINT: ${MENU_ENDPOINT}
      BLOCKS_ENDPOINT: ${BLOCKS_ENDPOINT}
    volumes:
      - ${STATIC_SERVER_SITE_DIR}/prod/.ssr:/app/
    networks:
      - abcnorio_net_proxy
  web:
    image: caddy:2.11-alpine
    container_name: web
    restart: always
    mem_limit: 128m
    environment:
      DOMAIN_PRODUCTION: ${DOMAIN_PRODUCTION}
      DOMAIN_WP_STAGING: ${DOMAIN_WP_STAGING}
      DOMAIN_DEV: ${DOMAIN_DEV}
      DOMAIN_STAGING: ${DOMAIN_STAGING}
      DOMAIN_PREVIEW: ${DOMAIN_PREVIEW}
      DOMAIN_DOCS: ${DOMAIN_DOCS}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ${STATIC_SERVER_CADDYFILE}:/etc/caddy/Caddyfile
      - ${STATIC_SERVER_SITE_DIR}:/srv/
      - web_data:/data
      - web_config:/config
    networks:
      - abcnorio_net_web
  deploy-orchestrator:
    build:
      context: ${ASTRO_HOST_ROOT}
      dockerfile: Dockerfile
      args:
        SHARED_GID: ${PROJECT_GID}
        SHARED_GROUP: ${PROJECT_GROUP}
    container_name: deploy-orchestrator
    user: root
    mem_limit: 800m
    stop_grace_period: 120s
    group_add:
      - ${PROJECT_GROUP}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4011/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    env_file:
      - ${ASTRO_SITE_DIR}/.env
      - ${ORCHESTRATOR_HOST_DIR}/.env
    environment:
      ASTRO_SITE_ROOT: /astro-source
      ASTRO_BUILD_WORKDIR: /astro-build
      ASTRO_STAGING_SITE_ROOT: /staging-site
      ASTRO_BUILD_TRIGGER_SECRET: ${ASTRO_BUILD_TRIGGER_SECRET}
      MODE: ${DEV_MODE:-development}
      DEV_CMS: ${DOMAIN_DEV_CMS}
      STAGING_CMS: ${DOMAIN_STAGING_CMS}
      DEV_FRONTEND_URL: https://${DOMAIN_DEV}/
      STAGING_FRONTEND_URL: https://${DOMAIN_STAGING}/
      PRODUCTION_FRONTEND_URL: https://${DOMAIN_PRODUCTION}/
      PREVIEW_FRONTEND_URL: https://${DOMAIN_PREVIEW}/
      ASTRO_WEBCOMPONENTS_SOURCE_DIR: /astro-build/abcnorio-webcomponents
      PROJECT_UID: ${PROJECT_UID}
      PROJECT_GID: ${PROJECT_GID}
      PROJECT_GROUP: ${PROJECT_GROUP}
      PRODUCTION_BUILD_PATH: /shared/static/prod
      PREVIEW_BUILD_PATH: /shared/static/preview
      STAGING_UPLOADS_DIR: /staging-uploads
      DEV_UPLOADS_DIR: /dev-uploads
      PRODUCTION_UPLOADS_PATH: /shared/static/uploads
      STAGING_DB_HOST: mariadb
      STAGING_DB_NAME: ${STAGING_DB_NAME}
      STAGING_DB_USER: ${STAGING_DB_USER}
      STAGING_DB_PASSWORD: ${STAGING_DB_PASSWORD}
      DEV_DB_HOST: mariadb
      DEV_DB_NAME: ${DEV_DB_NAME}
      DEV_DB_USER: ${DEV_DB_USER}
      DEV_DB_PASSWORD: ${DEV_DB_PASSWORD}
    command: >
      bash -lc "umask 0002 && mkdir -p /shared/static/dev /shared/static/staging /shared/static/prod /shared/static/prod/.ssr /shared/static/preview /astro-build/build-archives && cd /orchestrator && node index.mjs"
    volumes:
      - ${ORCHESTRATOR_HOST_DIR}:/orchestrator/:ro
      - ${ASTRO_SITE_DIR}:/astro-source/:ro
      - ${ASTRO_WEBCOMPONENTS_DIR}:/abcnorio-webcomponents/:ro
      - ${ASTRO_BUILD_WORKDIR_HOST_DIR}:/astro-build/
      - ${ASTRO_STAGING_SITE_DIR}:/staging-site/
      - ${STATIC_SERVER_SITE_DIR}:/shared/static/
      - ${STAGING_HOST_ROOT}bedrock/web/app/uploads:/staging-uploads
      - ${DEV_HOST_ROOT}bedrock/web/app/uploads:/dev-uploads
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - abcnorio_net_orchestrator
  abcwpstaging:
    build: 
      context: ${STAGING_HOST_ROOT}
      dockerfile: ../Dockerfile
      args:
        USER: ${STAGING_USER}
        SHARED_GID: ${PROJECT_GID}
        SHARED_GROUP: ${PROJECT_GROUP}
    container_name: abcwpstaging
    mem_limit: 512m
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/wp-json/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - 127.0.0.1:8100:80
    env_file:
      - ./wp/runtime.env
      - ./wp/staging.env
    environment:
      ASTRO_BUILD_TRIGGER_SECRET: ${ASTRO_BUILD_TRIGGER_SECRET}
      HEADLESS_FRONTEND_URL: https://${DOMAIN_STAGING}/
      PREVIEW_FRONTEND_URL: https://${DOMAIN_PREVIEW}/
      PRODUCTION_FRONTEND_URL: https://${DOMAIN_PRODUCTION}/
      DEV_FRONTEND_URL: https://${DOMAIN_DEV}/
      STAGING_FRONTEND_URL: https://${DOMAIN_STAGING}/
      PROJECT_UID: ${PROJECT_UID}
      PROJECT_GID: ${PROJECT_GID}
      CADDY_GLOBAL_OPTIONS: |
        auto_https off
        frankenphp {
          php_ini upload_max_filesize 100M
          php_ini post_max_size 100M
          php_ini log_errors On
          php_ini error_log /dev/stderr
          # OPcache tuning — validate_timestamps 0 disables file-change detection;
          # restart the container to pick up PHP file changes.
          php_ini opcache.memory_consumption 128
          php_ini opcache.max_accelerated_files 10000
          php_ini opcache.validate_timestamps 0
          php_ini opcache.interned_strings_buffer 16
          php_ini opcache.jit tracing
          php_ini opcache.jit_buffer_size 32M
          php_ini memory_limit 256M
        }
    restart: always
    volumes:
      - ${STAGING_HOST_ROOT}Caddyfile:/etc/caddy/Caddyfile
      - ${STAGING_HOST_ROOT}bedrock:/app
      - ./wp/object-cache.php:/app/web/app/object-cache.php:ro
      - ${ASTRO_BUILD_ARCHIVE_HOST_DIR}:/astro/build-archives:ro
    networks:
      - abcnorio_net_orchestrator
      - abcnorio_net_proxy
  abcwpdev:
    build: 
      context: ${DEV_HOST_ROOT}
      dockerfile: ../Dockerfile
      args:
        USER: ${DEV_USER}
        SHARED_GID: ${PROJECT_GID}
        SHARED_GROUP: ${PROJECT_GROUP}
    container_name: abcwpdev
    mem_limit: 512m
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/wp-json/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - 127.0.0.1:8101:80
    env_file:
      - ./wp/runtime.env
      - ./wp/dev.env
    environment:
      ASTRO_BUILD_TRIGGER_SECRET: ${ASTRO_BUILD_TRIGGER_SECRET}
      HEADLESS_FRONTEND_URL: https://${DOMAIN_DEV}/
      PREVIEW_FRONTEND_URL: https://${DOMAIN_PREVIEW}/
      PRODUCTION_FRONTEND_URL: https://${DOMAIN_PRODUCTION}/
      DEV_FRONTEND_URL: https://${DOMAIN_DEV}/
      STAGING_FRONTEND_URL: https://${DOMAIN_STAGING}/
      PROJECT_UID: ${PROJECT_UID}
      PROJECT_GID: ${PROJECT_GID}
      CADDY_GLOBAL_OPTIONS: |
        auto_https off
        frankenphp {
          php_ini upload_max_filesize 100M
          php_ini post_max_size 100M
          php_ini log_errors On
          php_ini error_log /dev/stderr
          # OPcache tuning — validate_timestamps 1 + revalidate_freq 0 checks every request;
          # file changes are picked up immediately without container restart.
          php_ini opcache.memory_consumption 128
          php_ini opcache.max_accelerated_files 10000
          php_ini opcache.validate_timestamps 1
          php_ini opcache.revalidate_freq 0
          php_ini opcache.interned_strings_buffer 16
          php_ini opcache.jit function
          php_ini opcache.jit_buffer_size 32M
          php_ini memory_limit 256M
        }
    restart: always
    volumes:
      - ${DEV_HOST_ROOT}Caddyfile:/etc/caddy/Caddyfile
      - ${DEV_HOST_ROOT}bedrock:/app
      - ./wp/object-cache.php:/app/web/app/object-cache.php:ro
      - ${ABCNORIO_FUNC_HOST_DIR}:/abcnorio-func
      - ${ASTRO_BUILD_ARCHIVE_HOST_DIR}:/astro/build-archives:ro
    networks:
      - abcnorio_net_orchestrator
      - abcnorio_net_proxy
  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    restart: always
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - 127.0.0.1:${LOCAL_DB_PORT:-3309}:3306
    environment:
      # MARIADB_DATABASE, MARIADB_USER, and MARIADB_PASSWORD are required.
      # So on first run, mariadb creates the proper users / passwords etc.
      MARIADB_ROOT_PASSWORD: ${STAGING_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${STAGING_DB_NAME}
      MARIADB_USER: ${STAGING_DB_USER}
      MARIADB_PASSWORD: ${STAGING_DB_PASSWORD}
      STAGING_DB_NAME: ${STAGING_DB_NAME}
      STAGING_DB_USER: ${STAGING_DB_USER}
      STAGING_DB_PASSWORD: ${STAGING_DB_PASSWORD}
      DEV_DB_NAME: ${DEV_DB_NAME}
      DEV_DB_USER: ${DEV_DB_USER}
      DEV_DB_PASSWORD: ${DEV_DB_PASSWORD}
    volumes:
      - abcwp_mardiadb_vol:/var/lib/mysql
      - ${STAGING_HOST_ROOT}mariadb.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ${WP_SQL_INIT_SCRIPT:-./wp/sql/001-dev-staging-dbs.sh}:/docker-entrypoint-initdb.d/001-dev-staging-dbs.sh:ro
    networks:
      - abcnorio_net_proxy
      - abcnorio_net_orchestrator
volumes:
  abcwp_mardiadb_vol: {}
  proxy_data: {}
  proxy_config: {}
  web_data: {}
  web_config: {}
networks:
  abcnorio_net_orchestrator:
    name: abcnorio_net_orchestrator
  abcnorio_net_proxy:
    name: abcnorio_net_proxy
    external: true
  abcnorio_net_web:
    name: abcnorio_net_web
    external: true