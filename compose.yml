services:
  proxy:
    image: caddy:2.11.2-alpine
    container_name: proxy
    restart: always
    mem_limit: 128m
    ports:
      - 80:80
      - 443:443
    environment:
      DOCS_DOMAIN: ${DOCS_DOMAIN}
    volumes:
      - ${PROXY_CADDYFILE}:/etc/caddy/Caddyfile
      - proxy_data:/data
      - proxy_config:/config
    networks:
      - abcnorio_net_web
      - abcnorio_net_internal
  astro:
    build: 
      context: ${ASTRO_HOST_ROOT}
      dockerfile: Dockerfile
      args:
        SHARED_GID: ${ARTIFACT_SHARED_GID}
        SHARED_GROUP: ${ARTIFACT_SHARED_GROUP}
    container_name: astro
    user: node
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3033/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 600m
    environment:
      DEV_CMS: ${DEV_CMS}
      STAGING_CMS: ${STAGING_CMS}
      MODE: ${DEV_MODE:-development}
      MENU_ENDPOINT: ${MENU_ENDPOINT}
      REST_ENDPOINT: ${REST_ENDPOINT}
      BLOCKS_ENDPOINT: ${BLOCKS_ENDPOINT}
      DEV_SEARCH_API: ${DEV_SEARCH_API}
      STAGING_SEARCH_API: ${STAGING_SEARCH_API}
      DEV_FRONTEND_URL: ${DEV_FRONTEND_URL}
      STAGING_FRONTEND_URL: ${STAGING_FRONTEND_URL}
      PRODUCTION_FRONTEND_URL: ${PRODUCTION_FRONTEND_URL}
      PREVIEW_FRONTEND_URL: ${PREVIEW_FRONTEND_URL}
    ports: 
      - 127.0.0.1:3033:3033
    volumes:
      - ${ASTRO_SITE_DIR}:/app/
    networks:
      - abcnorio_net_internal
  astro-staging:
    build:
      context: ${ASTRO_HOST_ROOT}
      dockerfile: Dockerfile
      args:
        SHARED_GID: ${ARTIFACT_SHARED_GID}
        SHARED_GROUP: ${ARTIFACT_SHARED_GROUP}
    container_name: astro-staging
    user: node
    restart: always
    mem_limit: 1024m
    command: ["bash", "-c", "umask 0002 && cd /app && npm install && npm run docker-staging"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3033/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      DEV_CMS: ${DEV_CMS}
      STAGING_CMS: ${STAGING_CMS}
      MODE: ${STAGING_MODE:-staging}
      MENU_ENDPOINT: ${MENU_ENDPOINT}
      REST_ENDPOINT: ${REST_ENDPOINT}
      BLOCKS_ENDPOINT: ${BLOCKS_ENDPOINT}
      DEV_SEARCH_API: ${DEV_SEARCH_API}
      STAGING_SEARCH_API: ${STAGING_SEARCH_API}
      DEV_FRONTEND_URL: ${DEV_FRONTEND_URL}
      STAGING_FRONTEND_URL: ${STAGING_FRONTEND_URL}
      PRODUCTION_FRONTEND_URL: ${PRODUCTION_FRONTEND_URL}
      PREVIEW_FRONTEND_URL: ${PREVIEW_FRONTEND_URL}
    ports:
      - 127.0.0.1:3034:3033
    volumes:
      - ${ASTRO_STAGING_SITE_DIR}:/app/
    depends_on:
      - deploy-orchestrator
    networks:
      - abcnorio_net_internal
  docs:
    build:
      context: ${DOCS_HOST_ROOT}
      dockerfile: Dockerfile
    container_name: docs
    mem_limit: 600m
    volumes:
      - ${STATIC_SERVER_SITE_DIR}docs:/app/dist
  web:
    image: caddy:2.11-alpine
    container_name: web
    restart: always
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ${STATIC_SERVER_CADDYFILE}:/etc/caddy/Caddyfile
      - ${STATIC_SERVER_SITE_DIR}:/srv/
      - web_data:/data
      - web_config:/config
    networks:
      - abcnorio_net_web
  deploy-orchestrator:
    build:
      context: ${ASTRO_HOST_ROOT}
      dockerfile: Dockerfile
      args:
        SHARED_GID: ${ARTIFACT_SHARED_GID}
        SHARED_GROUP: ${ARTIFACT_SHARED_GROUP}
    container_name: deploy-orchestrator
    user: node
    mem_limit: 1024m
    group_add:
      - ${ARTIFACT_SHARED_GROUP}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4011/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    env_file:
      - ${ASTRO_SITE_DIR}/.env
      - ${ORCHESTRATOR_HOST_DIR}/.env
    environment:
      ASTRO_SITE_ROOT: /astro-site
      ASTRO_STAGING_SITE_ROOT: /staging-site
      MODE: ${DEV_MODE:-development}
      ARTIFACT_SHARED_GID: ${ARTIFACT_SHARED_GID}
      ARTIFACT_SHARED_GROUP: ${ARTIFACT_SHARED_GROUP}
      PRODUCTION_BUILD_PATH: /shared/static/prod
      PREVIEW_BUILD_PATH: /shared/static/preview
      STAGING_UPLOADS_DIR: /staging-uploads
      DEV_UPLOADS_DIR: /dev-uploads
      STAGING_DB_HOST: mariadb
      STAGING_DB_NAME: ${STAGING_DB_NAME}
      STAGING_DB_USER: ${STAGING_DB_USER}
      STAGING_DB_PASSWORD: ${STAGING_DB_PASSWORD}
      DEV_DB_HOST: mariadb
      DEV_DB_NAME: ${DEV_DB_NAME}
      DEV_DB_USER: ${DEV_DB_USER}
      DEV_DB_PASSWORD: ${DEV_DB_PASSWORD}
    command: >
      bash -lc "umask 0002 && mkdir -p /shared/static/dev /shared/static/staging /shared/static/prod /shared/static/preview /astro-site/build-archives && cd /orchestrator && npm install && node index.mjs"
    volumes:
      - ${ORCHESTRATOR_HOST_DIR}:/orchestrator/
      - ${ASTRO_SITE_DIR}:/astro-site/
      - ${ASTRO_STAGING_SITE_DIR}:/staging-site/
      - ${STATIC_SERVER_SITE_DIR}:/shared/static/
      - ${STAGING_HOST_ROOT}bedrock/web/app/uploads:/staging-uploads
      - ${DEV_HOST_ROOT}bedrock/web/app/uploads:/dev-uploads
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - abcnorio_net_orchestrator
  cms_staging:
    build: 
      context: ${STAGING_HOST_ROOT}
      dockerfile: ../Dockerfile
      args:
        USER: ${STAGING_USER}
        SHARED_GID: ${ARTIFACT_SHARED_GID}
        SHARED_GROUP: ${ARTIFACT_SHARED_GROUP}
    container_name: wp_staging
    mem_limit: 512m
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/wp-json/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - 127.0.0.1:8100:80
    env_file:
      - ./wp/runtime.env
      - ./wp/staging.env
    environment:
      HEADLESS_FRONTEND_URL: ${STAGING_FRONTEND_URL}
      PREVIEW_FRONTEND_URL: ${PREVIEW_FRONTEND_URL}
      DEV_FRONTEND_URL: ${DEV_FRONTEND_URL}
      STAGING_FRONTEND_URL: ${STAGING_FRONTEND_URL}
      CADDY_GLOBAL_OPTIONS: |
        auto_https off
        frankenphp {
          php_ini upload_max_filesize 100M
          php_ini post_max_size 100M
          php_ini log_errors On
          php_ini error_log /dev/stderr
          # OPcache tuning — validate_timestamps 0 disables file-change detection;
          # restart the container to pick up PHP file changes.
          php_ini opcache.memory_consumption 128
          php_ini opcache.max_accelerated_files 10000
          php_ini opcache.validate_timestamps 0
          php_ini opcache.interned_strings_buffer 16
          php_ini opcache.jit tracing
          php_ini opcache.jit_buffer_size 32M
          php_ini memory_limit 256M
        }
    restart: always
    volumes:
      - ${STAGING_HOST_ROOT}Caddyfile:/etc/caddy/Caddyfile
      - ${STAGING_HOST_ROOT}bedrock:/app
      - ${ASTRO_BUILD_ARCHIVE_HOST_DIR}:/astro/build-archives:ro
    networks:
      - abcnorio_net_orchestrator
      - abcnorio_net_internal
  cms_dev:
    build: 
      context: ${DEV_HOST_ROOT}
      dockerfile: ../Dockerfile
      args:
        USER: ${DEV_USER}
        SHARED_GID: ${ARTIFACT_SHARED_GID}
        SHARED_GROUP: ${ARTIFACT_SHARED_GROUP}
    container_name: wp_dev
    mem_limit: 512m
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/wp-json/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - 127.0.0.1:8101:80
    env_file:
      - ./wp/runtime.env
      - ./wp/dev.env
    environment:
      HEADLESS_FRONTEND_URL: ${DEV_FRONTEND_URL}
      PREVIEW_FRONTEND_URL: ${PREVIEW_FRONTEND_URL}
      DEV_FRONTEND_URL: ${DEV_FRONTEND_URL}
      STAGING_FRONTEND_URL: ${STAGING_FRONTEND_URL}
      CADDY_GLOBAL_OPTIONS: |
        auto_https off
        frankenphp {
          php_ini upload_max_filesize 100M
          php_ini post_max_size 100M
          php_ini log_errors On
          php_ini error_log /dev/stderr
          # OPcache tuning — validate_timestamps 1 + revalidate_freq 0 checks every request;
          # file changes are picked up immediately without container restart.
          php_ini opcache.memory_consumption 128
          php_ini opcache.max_accelerated_files 10000
          php_ini opcache.validate_timestamps 1
          php_ini opcache.revalidate_freq 0
          php_ini opcache.interned_strings_buffer 16
          php_ini opcache.jit function
          php_ini opcache.jit_buffer_size 32M
          php_ini memory_limit 256M
        }
    restart: always
    volumes:
      - ${DEV_HOST_ROOT}Caddyfile:/etc/caddy/Caddyfile
      - ${DEV_HOST_ROOT}bedrock:/app
      - ${ABCNORIO_FUNC_HOST_DIR}:/app/packages/abcnorio-func
      - ${ASTRO_BUILD_ARCHIVE_HOST_DIR}:/astro/build-archives:ro
    networks:
      - abcnorio_net_orchestrator
      - abcnorio_net_internal
  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    restart: always
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - 127.0.0.1:${LOCAL_DB_PORT:-3309}:3306
    environment:
      # MARIADB_DATABASE, MARIADB_USER, and MARIADB_PASSWORD are required.
      # So on first run, mariadb creates the proper users / passwords etc.
      MARIADB_ROOT_PASSWORD: ${STAGING_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${STAGING_DB_NAME}
      MARIADB_USER: ${STAGING_DB_USER}
      MARIADB_PASSWORD: ${STAGING_DB_PASSWORD}
      STAGING_DB_NAME: ${STAGING_DB_NAME}
      STAGING_DB_USER: ${STAGING_DB_USER}
      STAGING_DB_PASSWORD: ${STAGING_DB_PASSWORD}
      DEV_DB_NAME: ${DEV_DB_NAME}
      DEV_DB_USER: ${DEV_DB_USER}
      DEV_DB_PASSWORD: ${DEV_DB_PASSWORD}
    volumes:
      - abcwp_mardiadb_vol:/var/lib/mysql
      - ${STAGING_HOST_ROOT}mariadb.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ${WP_SQL_INIT_SCRIPT:-./wp/sql/001-dev-staging-dbs.sh}:/docker-entrypoint-initdb.d/001-dev-staging-dbs.sh:ro
    networks:
      - abcnorio_net_internal
      - abcnorio_net_orchestrator
volumes:
  abcwp_mardiadb_vol: {}
  proxy_data: {}
  proxy_config: {}
  web_data: {}
  web_config: {}
networks:
  abcnorio_net_orchestrator:
    name: abcnorio_net_orchestrator
  abcnorio_net_internal:
    name: abcnorio_net_internal
    external: true
  abcnorio_net_web:
    name: abcnorio_net_web
    external: true