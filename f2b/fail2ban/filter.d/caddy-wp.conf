[Definition]
# Matches Caddy JSON-format access log lines for failed WP login attempts.
# Caddy JSON fields used: request.remote_ip, request.uri, status
# Triggers on HTTP 401 responses to /wp/wp-login.php
failregex = "request":{[^}]*"remote_ip":"<HOST>"[^}]*"uri":"\/wp\/wp-login\.php[^"]*"[^}]*}[^}]*"status":401\b

ignoreregex =
