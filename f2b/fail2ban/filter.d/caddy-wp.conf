[Definition]
# Matches Caddy JSON-format access log lines for failed WP login POSTs.
# WordPress typically returns HTTP 200 for failed logins and 302 for successful ones.
# Caddy JSON fields used: request.remote_ip, request.method, request.uri, status
failregex = ^.*"remote_ip":"<HOST>".*"method":"POST".*"uri":"(?:\/wp\/wp-login\.php|\/abcnorio-login)(?:\?[^"]*)?".*"status":200\b.*$

ignoreregex =
